# Tahti web (beta) — static SPA + public API proxy

# Non-JS-executing unfurl bots (Facebook/Slack/Discord/LinkedIn/WhatsApp/
# Apple's iMessage previewer) never run the SPA's own client-side metadata
# sync (src/lib/seo.ts), so they'd otherwise all get the one static
# index.html — same generic preview for every /c, /u, /r URL. See
# SEO-OG-NOTES.md for the full writeup. Narrow, expand only if a real
# preview fails for a bot not listed here.
map $http_user_agent $og_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*Twitterbot 1;
    ~*Slackbot 1;
    ~*Discordbot 1;
    ~*LinkedInBot 1;
    ~*WhatsApp 1;
    ~*Applebot 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Without this, nginx resolves api.tahti.live's IP once at container
    # startup and caches it for the process lifetime -- if that IP later
    # changes (CDN rotation, host migration), every proxied request hangs
    # forever instead of failing fast, since nginx keeps dialing the dead
    # IP. 127.0.0.11 is Docker Compose's embedded per-network DNS, which
    # forwards to the host's real resolvers. Requires a variable (not a
    # literal host) in proxy_pass below for this to actually take effect.
    resolver 127.0.0.11 valid=30s;
    set $tahti_api_upstream api.tahti.live;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Disco-widget sandbox: a reviewed bundle's JS runs ONLY inside this
    # document, loaded by DiscoWidgetFrame in a cookieless iframe
    # (sandbox="allow-scripts", no allow-same-origin). The HTML is a
    # hand-written string so the SPA's own JS never shares the realm.
    # Integrity is pinned in Vite/dev; nginx interpolates the hash into
    # the script src and 404s unknown hashes via the bundle proxy.
    # `{64}` must be inside quotes — nginx otherwise treats it as a config
    # block and PCRE2 sees a truncated `[0-9a-f]` character class.
    location ~ "^/widget-sandbox/bundle/([0-9a-f]{64})$" {
        rewrite ^/widget-sandbox/bundle/(.*)$ /api/v1/disco-widgets/bundle/$1 break;
        proxy_pass https://$tahti_api_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location ~ "^/widget-sandbox/([0-9a-f]{64})/?$" {
        default_type text/html;
        charset utf-8;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"></head><body><div id="disco-widget-root"></div><script type="module" src="/widget-sandbox/bundle/$1"></script></body></html>';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bot-facing OG documents for /c/*, /u/*, /r/* (see the $og_bot map
    # above and SEO-OG-NOTES.md). Only a listed bot UA gets rewritten to the
    # internal proxy below; every other request — real browsers included —
    # falls straight through to the SPA fallback, unaffected.
    location ~ ^/c/(?<og_slug>[^/]+)/?$ {
        if ($og_bot) {
            rewrite ^ /og-proxy/channel/$og_slug last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/u/(?<og_slug>[^/]+)/?$ {
        if ($og_bot) {
            rewrite ^ /og-proxy/profile/$og_slug last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Collection slugs are globally unique (Collection.slug @unique), so
    # only the slug segment is forwarded — the username in the URL is for
    # readability, not lookup, matching the SPA's own fetchCollection(slug).
    location ~ ^/u/[^/]+/c/(?<og_slug>[^/]+)/?$ {
        if ($og_bot) {
            rewrite ^ /og-proxy/collection/$og_slug last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/r/(?<og_slug>[^/]+)/?$ {
        if ($og_bot) {
            rewrite ^ /og-proxy/release/$og_slug last;
        }
        try_files $uri $uri/ /index.html;
    }

    # internal-only — reached solely via the rewrites above, never directly
    # by a client request.
    location ^~ /og-proxy/ {
        internal;
        rewrite ^/og-proxy/(.*)$ /api/og/$1 break;
        proxy_pass https://$tahti_api_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /sitemap-profiles.xml {
        proxy_pass https://$tahti_api_upstream/api/sitemap/profiles.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
    }

    location = /sitemap-releases.xml {
        proxy_pass https://$tahti_api_upstream/api/sitemap/releases.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
    }

    # Same-origin API → public Tahti API (cookies work; CORS not needed for same origin)
    #
    # proxy_pass to a variable host disables nginx's usual location-prefix
    # rewriting (the request URI would otherwise be forwarded verbatim as
    # the literal text after the variable, i.e. every request here would
    # collapse to plain "/" on the upstream instead of the real path).
    # rewrite ... break first, then proxy_pass without a URI, so the
    # rewritten path is what actually gets forwarded.
    location ^~ /tahti-api/ {
        rewrite ^/tahti-api/(.*)$ /$1 break;
        proxy_pass https://$tahti_api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain api.tahti.live $host;
        proxy_cookie_path / /;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Optional: also expose /api for absolute paths some clients use.
    # Same variable-proxy_pass caveat as /tahti-api/ above; $request_uri
    # (the original, unrewritten request path) keeps this one path-correct
    # without needing a rewrite since the prefix here already matches
    # what upstream expects.
    location ^~ /api/ {
        proxy_pass https://$tahti_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.tahti.live;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain api.tahti.live $host;
        proxy_cookie_path / /;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(?:svg|png|jpe?g|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
