# Beta Tahti client — runs alongside /srv/tahti on vimage.
# Host port 15180 → Nginx Proxy Manager → beta.tahti.live
#
# Image is built by deploy-vimage.sh (tahti-beta-web:local).

services:
  tahti-beta-web:
    image: tahti-beta-web:local
    container_name: tahti-beta-web
    restart: unless-stopped
    ports:
      - '15180:80'
