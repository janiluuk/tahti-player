<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tahti · Independent music, live</title>
    <meta
      name="description"
      content="Listen to independent artists, live channels, radio, and lossless releases on Tahti."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tahti" />
    <meta property="og:title" content="Tahti · Independent music, live" />
    <meta
      property="og:description"
      content="Listen to independent artists, live channels, radio, and lossless releases on Tahti."
    />
    <meta property="og:url" content="https://app.tahti.live/" />
    <meta property="og:image" content="https://tahti.live/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://app.tahti.live/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <script>
      (function () {
        try {
          var bag = localStorage.getItem('tahti-web-theme');
          var themeId = null;
          var dark = true;
          if (bag) {
            var parsed = JSON.parse(bag);
            var state = parsed && parsed.state ? parsed.state : parsed;
            if (state) {
              if (typeof state.themeId === 'string') themeId = state.themeId;
              if (typeof state.dark === 'boolean') dark = state.dark;
            }
          }
          if (!themeId)
            themeId = localStorage.getItem('tahti-nuclear-theme-id');
          var darkRaw = localStorage.getItem('tahti-nuclear-dark');
          if (darkRaw != null) dark = darkRaw === '1';
          if (themeId)
            document.documentElement.setAttribute('data-theme-id', themeId);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
          else document.documentElement.removeAttribute('data-theme');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
