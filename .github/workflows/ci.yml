name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run the Playwright e2e suite (against beta.tahti.live)'
        required: false
        default: false
        type: boolean
      web_base_url:
        description: 'Base URL the e2e suite should run against'
        required: false
        default: https://beta.tahti.live
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read # snapshot baseline: list/download master's digest artifact

env:
  DO_NOT_TRACK: 1

jobs:
  build:
    name: Build + size guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for Rust changes
        id: rust-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'packages/player/src-tauri/**'
              - '**/Cargo.lock'
              - '**/Cargo.toml'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Get PNPM store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache turbo build outputs
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Rust
        if: steps.rust-changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        if: steps.rust-changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/player/src-tauri

      - name: Install system dependencies
        if: steps.rust-changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build upstream packages
        run: pnpm turbo build --filter='!@tahti-player/player'

      - name: Build player (frontend-only)
        if: steps.rust-changes.outputs.rust != 'true'
        run: pnpm turbo build:frontend --filter=@tahti-player/player

      - name: Build player (full Tauri)
        if: steps.rust-changes.outputs.rust == 'true'
        run: pnpm turbo build --filter=@tahti-player/player
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: File size guard
        run: pnpm check:file-size

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Get PNPM store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

  test:
    name: Test + snapshot digest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Get PNPM store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The build job just saved this exact key, so the upstream builds the
      # test task depends on replay from turbo instead of rebuilding.
      - name: Cache turbo build outputs
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build upstream packages
        run: pnpm turbo build --filter='!@tahti-player/player'

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm turbo test --continue

      - name: Get installed Playwright version
        if: steps.test.outcome == 'failure'
        id: playwright-version
        run: echo "version=$(pnpm --filter @tahti-player/tahti-web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.test.outcome == 'failure'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.test.outcome == 'failure' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tahti-player/tahti-web exec playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only
        if: steps.test.outcome == 'failure' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tahti-player/tahti-web exec playwright install-deps chromium

      # The digest should list only what this PR changed: take the latest
      # finished master run's digest as the baseline (see the script header).
      - name: Fetch master snapshot baseline
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/fetch-snapshot-baseline.sh ci.yml snapshot-digest

      - name: Build snapshot digest
        if: steps.test.outcome == 'failure'
        continue-on-error: true
        run: node scripts/ci/build-snapshot-digest.mjs
        env:
          # Where this run's PNGs will live once published below, so the
          # digest can embed real ![]() image links instead of bare
          # filenames. Only meaningful for pull_request (no PR to publish
          # under otherwise) -- the publish step itself also skips then.
          SNAPSHOT_DIFF_PUBLIC_BASE_URL: >-
            ${{ github.event_name == 'pull_request' &&
            format('https://raw.githubusercontent.com/{0}/visual-snapshot-diffs/pr-{1}', github.repository, github.event.pull_request.number) || '' }}

      - name: Write snapshot digest to job summary
        if: steps.test.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ -f snapshot-digest/digest.md ]; then
            cat snapshot-digest/digest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload snapshot digest artifact
        if: steps.test.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-digest
          path: snapshot-digest/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish visual snapshot diffs
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/ci/publish-visual-snapshot-diffs.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      - name: Comment snapshot digest on PR
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SNAPSHOT_DIGEST_MD: snapshot-digest/digest.md
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const mod = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/comment-snapshot-digest.mjs`).href
            );
            await mod.default({ github, context, core });

      - name: Clear stale snapshot digest comment
        if: steps.test.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SNAPSHOT_DIGEST_CLEAR: '1'
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const mod = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/comment-snapshot-digest.mjs`).href
            );
            await mod.default({ github, context, core });

      - name: Fail job if tests failed (non-snapshot)
        if: steps.test.outcome == 'failure'
        run: |
          if [ -f snapshot-digest/digest.json ] && node -e "const d=require('./snapshot-digest/digest.json'); process.exit(d.count > 0 ? 0 : 1)"; then
            echo "Snapshot mismatches detected — see snapshot digest artifact / PR comment. Not failing CI."
          else
            echo "Tests failed (non-snapshot). See test logs above."
            exit 1
          fi

  # Manual-only e2e run: dispatch the workflow with run_e2e=true. Runs the
  # Playwright suite against the deployed site (beta.tahti.live by default).
  e2e:
    name: E2E (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @tahti-player/tahti-web exec playwright install chromium --with-deps

      - name: Resolve Playwright Chromium path
        run: |
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux/chrome' 2>/dev/null | head -1)"
          echo "PLAYWRIGHT_CHROMIUM_PATH=${CHROMIUM_PATH}" >> "$GITHUB_ENV"
          echo "Using Chromium at: ${CHROMIUM_PATH}"

      - name: Playwright e2e suite (manual)
        id: e2e
        continue-on-error: true
        run: pnpm --filter @tahti-player/tahti-web exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.web_base_url }}
          PLAYWRIGHT_CHROMIUM_PATH: ${{ env.PLAYWRIGHT_CHROMIUM_PATH }}
          TAHTI_E2E_PASSWORD: ${{ secrets.TAHTI_E2E_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/tahti-web/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/tahti-web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail job if e2e suite failed
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "E2E suite failed. See the playwright-report / playwright-test-results artifacts."
          exit 1

  # Aggregate gate (keeps the historical required `ci` check name working and
  # gives a single pass/fail node). The e2e job is manual-only and excluded.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    if: always()
    steps:
      - name: Check required jobs
        if: needs.build.result != 'success' || needs.lint.result != 'success' || needs.test.result != 'success'
        run: |
          echo "::error::build=${{ needs.build.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }}"
          exit 1

      - name: Required jobs passed
        if: needs.build.result == 'success' && needs.lint.result == 'success' && needs.test.result == 'success'
        run: echo "build, lint, test all succeeded"
