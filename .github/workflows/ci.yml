name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read # snapshot baseline: list/download master's digest artifact

env:
  DO_NOT_TRACK: 1

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for Rust changes
        id: rust-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'packages/player/src-tauri/**'
              - '**/Cargo.lock'
              - '**/Cargo.toml'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Get PNPM store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache turbo build outputs
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup Rust
        if: steps.rust-changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        if: steps.rust-changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/player/src-tauri

      - name: Install system dependencies
        if: steps.rust-changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build upstream packages
        run: pnpm turbo build --filter='!@tahti-player/player'

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm turbo test

      - name: Build player (frontend-only)
        if: steps.rust-changes.outputs.rust != 'true'
        run: pnpm turbo build:frontend --filter=@tahti-player/player

      - name: Build player (full Tauri)
        if: steps.rust-changes.outputs.rust == 'true'
        run: pnpm turbo build --filter=@tahti-player/player
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Get installed Playwright version
        if: steps.test.outcome == 'failure'
        id: playwright-version
        run: echo "version=$(pnpm --filter @tahti-player/tahti-web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.test.outcome == 'failure'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.test.outcome == 'failure' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tahti-player/tahti-web exec playwright install chromium --with-deps

      - name: Install Playwright OS dependencies only
        if: steps.test.outcome == 'failure' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @tahti-player/tahti-web exec playwright install-deps chromium

      # The digest should list only what this PR changed. Master's own run
      # uploads its digest (only when it had mismatches); take the latest
      # finished master run's, if any, as the baseline. No artifact there means
      # master had no mismatches, so an empty baseline is correct too. Failing
      # to fetch just falls back to listing everything.
      - name: Fetch master snapshot baseline
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch master --limit 20 \
            --json databaseId,status,conclusion \
            --jq '[.[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure"))][0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No finished master run found; listing every mismatch as new."
            exit 0
          fi
          if gh run download "$run_id" -n snapshot-digest -D snapshot-baseline; then
            echo "Using master run $run_id as the snapshot baseline."
          else
            echo "Master run $run_id has no snapshot-digest artifact (it had no mismatches)."
            mkdir -p snapshot-baseline
            echo '{"items":[],"standing":[]}' > snapshot-baseline/digest.json
          fi

      - name: Build snapshot digest
        if: steps.test.outcome == 'failure'
        run: node scripts/ci/build-snapshot-digest.mjs
        env:
          # Where this run's PNGs will live once published below, so the
          # digest can embed real ![]() image links instead of bare
          # filenames. Only meaningful for pull_request (no PR to publish
          # under otherwise) -- the publish step itself also skips then.
          SNAPSHOT_DIFF_PUBLIC_BASE_URL: >-
            ${{ github.event_name == 'pull_request' &&
            format('https://raw.githubusercontent.com/{0}/visual-snapshot-diffs/pr-{1}', github.repository, github.event.pull_request.number) || '' }}

      - name: Write snapshot digest to job summary
        if: steps.test.outcome == 'failure'
        run: |
          if [ -f snapshot-digest/digest.md ]; then
            cat snapshot-digest/digest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload snapshot digest artifact
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-digest
          path: snapshot-digest/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish visual snapshot diffs
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        run: node scripts/ci/publish-visual-snapshot-diffs.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      - name: Comment snapshot digest on PR
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SNAPSHOT_DIGEST_MD: snapshot-digest/digest.md
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const mod = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/comment-snapshot-digest.mjs`).href
            );
            await mod.default({ github, context, core });

      - name: Fail job if tests failed (non-snapshot)
        if: steps.test.outcome == 'failure'
        run: |
          if [ -f snapshot-digest/digest.json ] && node -e "const d=require('./snapshot-digest/digest.json'); process.exit(d.count > 0 ? 0 : 1)"; then
            echo "Snapshot mismatches detected — see snapshot digest artifact / PR comment. Not failing CI."
          else
            echo "Tests failed (non-snapshot). See test logs above."
            exit 1
          fi
