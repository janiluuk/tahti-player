name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DO_NOT_TRACK: 1

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Get PNPM store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm test

      - name: Install Playwright Chromium
        if: steps.test.outcome == 'failure'
        run: pnpm --filter @tahti-player/tahti-web exec playwright install chromium --with-deps

      - name: Build snapshot digest
        if: steps.test.outcome == 'failure'
        run: node scripts/ci/build-snapshot-digest.mjs

      - name: Write snapshot digest to job summary
        if: steps.test.outcome == 'failure'
        run: |
          if [ -f snapshot-digest/digest.md ]; then
            cat snapshot-digest/digest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload snapshot digest artifact
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-digest
          path: snapshot-digest/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment snapshot digest on PR
        if: steps.test.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SNAPSHOT_DIGEST_MD: snapshot-digest/digest.md
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const mod = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/comment-snapshot-digest.mjs`).href
            );
            await mod.default({ github, context, core });

      - name: Fail job if tests failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed — see snapshot-digest artifact / PR comment if snapshots mismatched."
          exit 1

      - name: Build
        run: pnpm build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
