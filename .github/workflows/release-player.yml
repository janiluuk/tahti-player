name: Release Player

# Tags pushed by bump-and-tag-player.yml use GITHUB_TOKEN, which never
# triggers other workflows, so that workflow calls this one directly.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
on:
  push:
    tags:
      - 'player@*.*.*'
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. player@1.47.112'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. player@1.47.112'
        required: true
        type: string

concurrency:
  group: release-player-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DO_NOT_TRACK: 1
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles app'
            arch: 'arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles app'
            arch: 'x64'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-tags: true
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION=${RELEASE_TAG#player@}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Get PNPM store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            file \
            patchelf

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          NOTES=$(node packages/tools/src/generate-release-notes.mjs "${{ steps.version.outputs.version }}")
          DELIMITER=$(openssl rand -hex 16)
          echo "notes<<$DELIMITER" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: false
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Tahti Player v${{ steps.version.outputs.version }}'
          releaseBody: '${{ steps.release_notes.outputs.notes }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-snap:
    needs: release-desktop
    uses: ./.github/workflows/release-snap.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  update-aur:
    needs: release-desktop
    uses: ./.github/workflows/update-aur.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}

  update-flathub:
    needs: release-desktop
    uses: ./.github/workflows/update-flathub.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}

  update-winget:
    needs: release-desktop
    uses: ./.github/workflows/update-winget.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  release-android:
    if: vars.ANDROID_RELEASES_ENABLED == 'true'
    needs: release-desktop
    uses: ./.github/workflows/release-android.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      publish: true
    secrets: inherit

  # Best-effort buildability check only: a distributable/signed iOS build needs
  # an Apple Developer certificate and provisioning profile, which aren't
  # configured here. This job never uploads a release artifact and never
  # blocks the desktop/Android releases if it fails.
  verify-ios-build:
    # Mobile releases are paused for now -- flip this to `true` to resume.
    if: false
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Get PNPM store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/player/src-tauri/target/
          key: ${{ runner.os }}-ios-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        working-directory: packages/player
        run: pnpm tauri ios init

      - name: Build for iOS simulator
        working-directory: packages/player
        run: pnpm tauri ios build --target aarch64-sim --ci
