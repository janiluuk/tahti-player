name: Update WinGet

# Called by release-player.yml once the GitHub Release is published, or run by
# hand for an existing player@ tag.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag or version to publish, e.g. player@1.47.112 or 1.47.112'
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version to publish, e.g. player@1.47.112 or 1.47.112'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${INPUT_TAG#player@}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=player@$VERSION" >> "$GITHUB_OUTPUT"

      # The secret is checked in the shell because a step-level `if:` on
      # secrets.* makes GitHub reject the whole workflow file.
      - name: Check WinGet credentials
        id: store
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_TOKEN secret is not set, skipping WinGet update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to WinGet
        if: steps.store.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Tahti.TahtiPlayer
          version: ${{ steps.version.outputs.version }}
          installers-regex: '\.(exe|msi)$'
          release-tag: ${{ steps.version.outputs.tag }}
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
