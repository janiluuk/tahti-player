name: tahti-player
base: core22
version: '${SNAP_VERSION}'
summary: Free music streaming app
description: |
  Tahti Player is a free, open-source music player without ads or tracking.
  Search for any song or artist, build playlists, and start listening.

grade: stable
confinement: strict

layout:
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  tahti-player:
    command: usr/bin/tahti-player
    desktop: usr/share/applications/live.tahti.player.desktop
    extensions: [gnome]
    environment:
      ALWAYS_USE_PULSEAUDIO: '1'
    plugs:
      - network
      - network-status
      - audio-playback
      - home
      - browser-support

package-repositories:
  - type: apt
    components: [main]
    suites: [jammy]
    key-id: 78E1918602959B9C59103100F1831DDAFC42E99D
    url: http://ppa.launchpad.net/snappy-dev/snapcraft-daily/ubuntu

parts:
  build-app:
    plugin: dump
    build-snaps:
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - xz-utils
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
      - patchelf
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    source: .
    override-build: |
      set -eu

      rustup default stable

      # The node/24 snap needs glibc 2.38; core22 has 2.35. The nodejs.org
      # binaries only need glibc 2.28.
      NODE_BASE=https://nodejs.org/dist/latest-v24.x
      curl -fsSL "$NODE_BASE/SHASUMS256.txt" -o node-shasums.txt
      NODE_FILE=$(awk '/linux-x64\.tar\.xz$/ {print $2}' node-shasums.txt)
      curl -fsSLO "$NODE_BASE/$NODE_FILE"
      grep " $NODE_FILE\$" node-shasums.txt | sha256sum -c -
      mkdir -p "$SNAPCRAFT_PART_BUILD/.node"
      tar -xJf "$NODE_FILE" -C "$SNAPCRAFT_PART_BUILD/.node" --strip-components=1
      rm "$NODE_FILE" node-shasums.txt
      export PATH="$SNAPCRAFT_PART_BUILD/.node/bin:$PATH"

      PNPM_VERSION=$(sed -n 's/.*"packageManager": "pnpm@\([0-9.]*\).*/\1/p' package.json)
      npm install -g "pnpm@$PNPM_VERSION"
      pnpm install --frozen-lockfile

      cd packages/player
      pnpm tauri build --bundles deb -c '{"bundle":{"createUpdaterArtifacts":false}}'

      dpkg -x src-tauri/target/release/bundle/deb/*.deb $SNAPCRAFT_PART_INSTALL/

      sed -i \
        "s|Icon=live.tahti.player|Icon=/usr/share/icons/hicolor/512x512/apps/live.tahti.player.png|g" \
        $SNAPCRAFT_PART_INSTALL/usr/share/applications/live.tahti.player.desktop
